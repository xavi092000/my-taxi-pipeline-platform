# Pipeline Bruin - exercice pedagogique NYC Taxi
# Projet d'apprentissage construit autour de l'orchestration Bruin, de l'ingestion Python
# et d'un rapport SQL DuckDB. Ce depot n'est pas un systeme de production.

name: nyc_taxi

schedule: daily

start_date: "2024-01-01"

concurrency: 1

default_connections:
  duckdb: duckdb-default

variables:
  taxi_types:
    type: array
    items:
      type: string
    default: ["yellow"]

# Limite actuelle : l'ingestion est concue pour les fichiers yellow taxi.
